<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popup Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Welcome</h1>
    <p>Click the button below to open the popup.</p>
    <button id="startBtn" class="btn">Start</button>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <button id="closeX" class="close-x" aria-label="Close">&times;</button>
      <h2 id="popupTitle">See you soon!</h2>
      <p>This is your popup. You clicked Start.</p>
      <button id="closeBtn" class="btn">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
